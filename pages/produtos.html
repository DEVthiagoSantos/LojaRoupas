<!DOCTYPE html>
<html lang="pt-BR">
    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Js MultiMarcas</title>

        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <header class="header">

            <div class="logo">
                <h1>Js.MultiMarcas</h1>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="../pages/carrinho.html">Meu Carrinho</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </nav>

            
            <div class="account-area">

                <div id="loggedOut">
                    <a href="../pages/login.html">Entrar</a>
                    <a href="../pages/cadastro.html">Criar conta</a>
                </div>

                <div id="loggedIn" hidden>

                    <a href="../pages/perfil.html" class="account-profile">
                        <span id="accountAvatar" class="account-avatar">U</span>
                        <span id="accountName">Usuário</span>
                    </a>

                    <button type="button" id="logoutButton">
                        Sair
                    </button>
                </div>
            </div>
            
        </header>

        <main>
            
            <section class="products-header">

                <span>CATÁLOGO</span>

                <h1>Todos os produtos</h1>

                <p>
                    Encontre o produto ideal para você.
                </p>
            </section>

            <section class="products-content">

                <div class="products-toolbar">

                    <div class="search-box">

                        <input
                             type="text"
                             id="searchProduct"
                             placeholder="Pesquisar produto...">

                    </div>

                    <div class="filters">

                        <select id="categoryFilter">

                            <option value="all">
                                Todas as categorias
                            </option>

                            <option value="camisas">
                                Camisas
                            </option>

                            <option value="Bermudas">
                                Bermudas
                            </option>

                            <option value="chapeu">
                                Chapéu
                            </option>

                            <option value="acessorios">
                                Acessórios
                            </option>

                        </select>

                        <select id="sortProducts">

                            <option value="default">
                                Ordenar
                            </option>

                            <option value="price-asc">
                                Menor preço
                            </option>

                            <option value="price-desc">
                                Maior preço
                            </option>

                            <option value="name">
                                Nome
                            </option>
                        </select>
                    </div>
                </div>

                <div class="catalog-grid", id="catalogGrid">

                    <!-- Produtos aqui-->
                
                    
                </div>

            </section>

        </main>

        <script src="../js/products.js"></script>
        <script src="../js/account.js"></script>
        
    </body>
</html>
