<!DOCTYPE html>
<html lang="pt-BR">
    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Js MultiMarcas</title>

        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <header class="header">

            <div class="logo">
                <h1>Js.MultiMarcas</h1>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="pages/produtos.html">Produtos</a></li>
                    <li><a href="#">Categorias</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </nav>
            
        </header>

        <main>
            
            <section class="products-page">

                <h1>Todos os Produtos</h1>

                <div class="filters">

                    <div class="filter-group">
                    
                       <label for="searchProduct">Pesquisar</label>

                       <input type="text" id="searchProduct" placeholder="Digite o nome do produto...">

                    </div>

                    <div class="filter-group">

                       <label for="categoryFilter">Categoria</label>

                           <select id="categoryFilter">

                               <option value="all">Todos</option>
                               <option value="camisas">Camisas</option>
                               <option value="Bermudas">Bermudas</option>
                               <option value="Nike">Nike</option>
                               <option value="Adidas">Adidas</option>

                           </select>
                    </div>

                    <div class="filter-group">

                           
                        <label for="sortProducts">Ordenar</label>
                                
                           
                        <select id="sortProducts">
        
                            <option value="">Selecione</option>
                            <option value="price-asc">Menor Preço</option>
                            <option value="price-desc">Maior Preço</option>
                            <option value="name">Nome (A-Z)</option>
                        
                        </select>
                        
                    </div>
                </div>

            </section>
        </main>

        <section class="products">

            <h2>Produtos em Destaque</h2>

            <div class="products-grid">

                <article class="product-card"
                         data-category="camisas"
                         data-price="70.90">

                    <img src="/images/camisaFlamengo.png" alt="Camisa de Time">

                    <div class="product-info">

                        <span class="category">
                            Masculino
                        </span>

                        <h3>Camisa do Flamengo</h3>

                        <p class="price">
                            R$ 70,90
                        </p>

                        <button>Adicionar ao Carrinho</button>
                    </div>

                </article>

                <article class="product-card"
                         data-category="camisas"
                         data-price="170.90">

                    <img src="/images/camisaBrasil.png" alt="Camisa de Time">

                    <div class="product-info">

                        <span class="category">
                            Masculino
                        </span>

                        <h3>Camisa do Brasil</h3>

                        <p class="price">
                            R$ 170,90
                        </p>

                        <button>Adicionar ao Carrinho</button>
                    </div>
                    
                </article>

                <article class="product-card"
                         data-category="camisas"
                         data-price="150.90">

                    <img src="/images/camisaPortugal.png" alt="Camisa de Time">

                    <div class="product-info">

                        <span class="category">
                            Masculino
                        </span>

                        <h3>Camisa de Portugal</h3>

                        <p class="price">
                            R$ 150,90
                        </p>

                        <button>Adicionar ao Carrinho</button>
                    </div>
                    
                </article>

            </div>

        </section>

        <script src="../js/products.js"></script>
        
    </body>
</html>
