<!DOCTYPE html>
<html lang="pt-BR">
    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Js MultiMarcas</title>

        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <header class="header">

            <div class="logo">
                <h1>Js.MultiMarcas</h1>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="../pages/carrinho.html">Meu Carrinho</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </nav>
            
        </header>

        <main>
            
            <section class="products-header">

                <span>CATÁLOGO</span>

                <h1>Todos os produtos</h1>

                <p>
                    Encontre o produto ideal para você.
                </p>
            </section>

            <section class="products-content">

                <div class="products-toolbar">

                    <div class="search-box">

                        <input
                             type="text"
                             id="searchProduct"
                             placeholder="Pesquisar produto...">

                    </div>

                    <div class="filters">

                        <select id="categoryFilter">

                            <option value="all">
                                Todas as categorias
                            </option>

                            <option value="camisas">
                                Camisas
                            </option>

                            <option value="Bermudas">
                                Bermudas
                            </option>

                            <option value="chapeu">
                                Chapéu
                            </option>

                            <option value="acessorios">
                                Acessórios
                            </option>

                        </select>

                        <select id="sortProducts">

                            <option value="default">
                                Ordenar
                            </option>

                            <option value="price-asc">
                                Menor preço
                            </option>

                            <option value="price-desc">
                                Maior preço
                            </option>

                            <option value="name">
                                Nome
                            </option>
                        </select>
                    </div>
                </div>

                <div class="catalog-grid">

                    <!-- Produtos aqui-->
                
                    <article class="catalog-card"
                         data-category="camisas"
                         data-name="Camisa do Flamengo"
                         data-price="70.90"
                         data-id="1">

                    <div class="catalog-image">
                        <img src="../images/camisaFlamengo.png" alt="Camisa de Time">
                    </div>

                    <div class="catalog-info">

                        <span class="category">
                            Masculino
                        </span>

                        <h3>Camisa do Flamengo</h3>

                        <p class="catalog-price">
                            R$ 70,90
                        </p>

                        <button class="add-cart">
                            Adicionar ao Carrinho</button>
                    </div>

                </article>

                <article class="catalog-card"
                         data-category="camisas"
                         data-name="Camisa do Brasil"
                         data-price="170.90"
                         data-id="2">

                    <div class="catalog-image">
                        <img src="../images/camisaBrasil.png" alt="Camisa de Time">
                    </div>

                    <div class="catalog-info">

                        <span class="category">
                            Masculino
                        </span>

                        <h3>Camisa do Brasil</h3>

                        <p class="catalog-price">
                            R$ 170,90
                        </p>

                        <button class="add-cart">
                            Adicionar ao Carrinho
                        </button>
                    </div>
                    
                </article>

                <article class="catalog-card"
                         data-category="camisas"
                         data-name="Camisa de Portugal"
                         data-price="150.90"
                         data-id="3">

                    <div class="catalog-image">
                        <img src="../images/camisaPortugal.png" alt="Camisa de Time">
                    </div>

                    <div class="catalog-info">

                        <span class="category">
                            Masculino
                        </span>

                        <h3>Camisa de Portugal</h3>

                        <p class="catalog-price">
                            R$ 150,90
                        </p>

                        <button class="add-cart">
                            Adicionar ao Carrinho
                        </button>
                    </div>
                    
                </article>

                </div>

            </section>

        </main>

        <script src="../js/products.js"></script>
        
    </body>
</html>
