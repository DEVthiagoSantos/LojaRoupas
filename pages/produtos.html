<!DOCTYPE html>
<html lang="pt-BR">
    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Js MultiMarcas</title>

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/perfil.css">

    </head>

    <body>

        <header class="header">

            <div class="logo">
                <h1>Js.MultiMarcas</h1>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="../pages/carrinho.html">Meu Carrinho</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </nav>

            
            <div class="account-area">

                <div id="loggedOut">
                    <a href="../pages/login.html">Entrar</a>
                    <a href="../pages/cadastro.html">Criar conta</a>
                </div>

                <div id="loggedIn" hidden>

                    <button type="button" id="openProfileMenu" class="account-profile">

                        <span id="accountAvatar" class="account-avatar">U</span>

                        <span id="accountName">Usuário</span>

                    </button>

                </div>
            </div>
            
        </header>

        <!-- Fundo do menu de perfil -->

        <div class="profile-overlay" id="profileOverlay">

            <!-- Menu lateral -->
             <aside class="profile-drawer" id="profileDrawer">

                <div class="drawer-header">

                    <h2>Menu Perfil</h2>

                    <button type="button" id="closeProfileMenu">
                        &times;
                    </button>

                </div>

                <section class="profile-card">

                    <div class="profile-header">

                        <div class="profile-photo-container">

                            <img
                                src="/images/default-profile.png"
                                alt="Foto de Perfil"
                                id="profileImage"
                            >

                            <label for="photoInput" class="photo-edit">
                                Alterar foto
                            </label>

                            <input
                                type="file"
                                id="photoInput"
                                accept="image/*"
                                hidden
                            >

                        </div>

                        <h1 id="profileName">Nome do Usuário</h1>

                        <p id="profileEmail">email@exemplo.com</p>

                    </div>

                    <div class="profile-divider"></div>

                    <form id="profileForm">

                        <h2>Informações pessoais</h2>

                        <div class="profile-form-group">

                            <label for="name">Nome completo</label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                readonly
                                required
                            >

                        </div>

                        <div class="profile-form-group">

                            <label for="email">E-mail</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                readonly
                                required
                            >

                        </div>

                        <p id="profileMessage" role="status"></p>

                        <div class="profile-buttons">

                            <button type="button" id="editProfileButton">
                                Editar perfil
                            </button>

                            <button
                                type="submit"
                                id="saveProfileButton"
                                hidden
                            >
                                Salvar alterações
                            </button>
                        </div>
                    </form>

                    <button type="button" id="logoutButton" class="profile-logout">
                        Sair da conta
                    </button>
                </section>
             </aside>
        </div>

        <main>
            
            <section class="products-header">

                <span>CATÁLOGO</span>

                <h1>Todos os produtos</h1>

                <p>
                    Encontre o produto ideal para você.
                </p>
            </section>

            <section class="products-content">

                <div class="products-toolbar">

                    <div class="search-box">

                        <input
                             type="text"
                             id="searchProduct"
                             placeholder="Pesquisar produto...">

                    </div>

                    <div class="filters">

                        <select id="categoryFilter">

                            <option value="all">
                                Todas as categorias
                            </option>

                            <option value="3">
                                Camisas
                            </option>

                            <option value="2">
                                Bermudas
                            </option>

                            <option value="4">
                                Kit
                            </option>

                            <option value="Acessorios">
                                Acessórios
                            </option>

                        </select>

                        <select id="sortProducts">

                            <option value="default">
                                Ordenar
                            </option>

                            <option value="price-asc">
                                Menor preço
                            </option>

                            <option value="price-desc">
                                Maior preço
                            </option>

                            <option value="name">
                                Nome
                            </option>
                        </select>
                    </div>
                </div>

                <div class="catalog-grid", id="catalogGrid">

                    <!-- Produtos aqui-->
                
                    
                </div>

            </section>

        </main>

        <script src="../js/products.js"></script>
        <script src="../js/account.js"></script>
        <script src="../js/perfil.js"></script>
        
    </body>
</html>
