<!DOCTYPE html>
<html lang="pt-BR">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Meu Perfil | Js.MultiMarcas</title>

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/perfil.css">

    </head>

    <body>

        <header class="header">

            <div class="logo">
                <h1>Js.MultiMarcas</h1>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="carrinho.html">Meu Carrinho</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </nav>
        </header>

        <main class="profile-container">

            <section class="profile-card">

                <div class="profile-header">

                    <div class="profile-photo-container">

                        <img
                            src="../images/default-profile.png"
                            alt="Foto de Perfil"
                            id="profileImage">

                        <label for="photoInput" class="photo-edit">
                            Alterar foto
                        </label>

                        <input type="file"
                               id="photoInput"
                               accept="image/*"
                               hidden
                        >

                    </div>

                    <h1 id="profileName">Nome do Usuário</h1>

                    <p id="profileEmail">email@exemplo.com</p>

                </div>

                <div class="profile-divider"></div>

                <form id="profileForm">

                    <h2>Informações pessoais</h2>

                    <div class="profile-form-group">

                        <label for="name">Nome completo</label>

                        <input
                             type="text"
                             id="name"
                             name="name"
                             readonly
                             required
                        >
                    </div>

                    <div class="profile-form-group">

                        <label for="email">E-mail</label>

                        <input
                             type="email"
                             id="email"
                             name="email"
                             readonly
                             required
                        >
                    </div>

                    <p id="profileMessage" role="status"></p>

                    <div class="profile-buttons">

                        <button
                            type="button"
                            id="editProfileButton"
                        >
                           Editar perfil
                        </button>

                        <button
                            type="submit"
                            id="saveProfileButton"
                            hidden
                        >
                            Salvar alterações                   
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <script src="../js/perfil.js"></script>
    </body>
</html>
